global:
  scrape_interval: 5s # Ambil metrik setiap 5 detik agar perubahan failover cepat terlihat

scrape_configs:
  - job_name: 'rumahsakit-ha-health'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://app-1:8080/health
        - http://app-2:8080/health
        - http://nginx:80/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115 # Arahkan pengujian lewat container blackbox-exporter