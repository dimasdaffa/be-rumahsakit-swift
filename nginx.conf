events {
    worker_connections 1024;
}

http {
    # DNS resolver internal Docker agar hostname app-1 dan app-2 selalu terdeteksi akurat
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream vapor_cluster {
        server app-1:8080 max_fails=2 fail_timeout=5s;
        server app-2:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        client_max_body_size 6m;

        listen 80;

        location / {
            proxy_pass http://vapor_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;

            add_header X-Served-By $upstream_addr always;
        }
    }
}